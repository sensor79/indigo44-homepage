<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C2C4C"/>
      <stop offset="48%" stop-color="#20372F"/>
      <stop offset="100%" stop-color="#16281F"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9CB57F" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9CB57F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#4C6B4F" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4C6B4F" stop-opacity="0"/>
    </radialGradient>
    <path id="leaf" d="M0,0 C46,-14 96,-4 132,34 C96,58 42,50 0,0 Z"/>
  </defs>

  <!-- base -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- botanical leaf cluster, upper right -->
  <g>
    <use href="#leaf" transform="translate(1120,150) rotate(18) scale(2.4)"  fill="#6E8A56" opacity="0.38"/>
    <use href="#leaf" transform="translate(1230,110) rotate(-30) scale(1.9)" fill="#9BB57C" opacity="0.30"/>
    <use href="#leaf" transform="translate(1310,230) rotate(65) scale(2.1)"  fill="#3E5A3F" opacity="0.42"/>
    <use href="#leaf" transform="translate(1180,260) rotate(-95) scale(1.6)" fill="#B8CBA0" opacity="0.22"/>
    <use href="#leaf" transform="translate(1400,180) rotate(140) scale(1.7)" fill="#5A7850" opacity="0.30"/>
    <use href="#leaf" transform="translate(1030,80)  rotate(-55) scale(1.4)" fill="#8AA36B" opacity="0.24"/>
  </g>

  <!-- botanical leaf cluster, lower left (soft, behind text) -->
  <g opacity="0.85">
    <use href="#leaf" transform="translate(60,760) rotate(-10) scale(2.0)"  fill="#3E5A3F" opacity="0.30"/>
    <use href="#leaf" transform="translate(150,820) rotate(35) scale(1.5)"  fill="#6E8A56" opacity="0.24"/>
    <use href="#leaf" transform="translate(-40,830) rotate(80) scale(1.8)" fill="#2E4534" opacity="0.35"/>
  </g>

  <!-- fine gold botanical line accent -->
  <g fill="none" stroke="#C9A66B" stroke-width="1.4" opacity="0.55" stroke-linecap="round">
    <path d="M 980 90 C 1120 220, 1180 420, 1080 640 C 1030 750, 950 800, 860 830"/>
    <path d="M 1020 260 C 1060 250, 1100 260, 1130 290"/>
    <path d="M 970 430 C 1010 420, 1050 430, 1080 460"/>
    <path d="M 930 610 C 970 600, 1010 610, 1040 640"/>
  </g>

  <text x="1560" y="870" font-family="sans-serif" font-size="14" fill="#F4F1E8" text-anchor="end" opacity="0.4">브랜드 촬영 이미지 준비중</text>
</svg>
